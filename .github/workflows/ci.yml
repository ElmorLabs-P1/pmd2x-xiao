name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    # Pinned rather than ubuntu-latest: that image moved to 26.04, which the
    # compile-sketches action's pinned Python version doesn't support yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create wifi_config.h from example
        run: |
          cp PMD2_XIAO_ESP32C6_Dashboard/wifi_config.h.example PMD2_XIAO_ESP32C6_Dashboard/wifi_config.h

      - name: Compile Dashboard sketch for Seeed XIAO ESP32C6
        uses: arduino/compile-sketches@v1
        with:
          # No OTA (2MB APP/2MB SPIFFS): WiFi + WebServer + BLE together
          # don't fit in the default 1.2MB app partition.
          fqbn: esp32:esp32:XIAO_ESP32C6:PartitionScheme=no_ota
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - name: NimBLE-Arduino
          sketch-paths: |
            - PMD2_XIAO_ESP32C6_Dashboard
